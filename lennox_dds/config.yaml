# Home Assistant add-on manifest for the Lennox iComfort DDS bridge.
#
# Prebuilt-image add-on (no on-server build): Supervisor pulls
#   {image}:{version} = ghcr.io/challgren/lennox-dds:0.1.0
# The image is the OpenDDS 3.22 sidecar (research/dds/docker). It does the
# DDS-Security handshake + RtpsRelay traversal and streams zoneStatus over a
# local WebSocket (port 8099, internal to the Supervisor network); the companion
# `lennox_dds` integration connects to it, auto-wired by Supervisor discovery.
#
# Two ways to supply DDS-Security credentials:
#   A) lennox_email + lennox_password -> the add-on logs in to the Lennox cloud,
#      mints its own participant identity, downloads the full bundle, caches it in
#      /data, and auto-derives home_id. Zero manual cert handling. (Recommended.)
#   B) leave the credentials blank and drop the 6 DDS-Security files into HA's
#      config at /config/lennox_dds/security/ (mapped read-only; see security_dir).
# Nothing secret is baked into the image.
name: Lennox iComfort DDS Bridge
version: "0.1.12"
slug: lennox_dds
description: OpenDDS sidecar bridging Lennox iComfort (M30 / prod4) realtime data to Home Assistant.
url: https://github.com/challgren/lennox-dds
image: ghcr.io/challgren/lennox-dds
arch:
  - amd64
init: false
# Reach the Supervisor for the discovery message + optional MQTT service creds.
hassio_api: true
hassio_role: default
# Advertise this add-on to the companion integration via Supervisor discovery.
discovery:
  - lennox_dds
# Optional: auto-pull MQTT broker creds if the user runs the Mosquitto add-on.
services:
  - mqtt:want
# Mount HA's /config read-only so the add-on can read the security bundle the
# user placed at /config/lennox_dds/security/ (appears at /homeassistant_config/...).
map:
  - type: homeassistant_config
    read_only: true
options:
  lennox_email: ""
  lennox_password: ""
  home_id: ""
  domain: 0
  topic: "LCC Zone Status"
  security_dir: "/homeassistant_config/lennox_dds/security"
  dcps_debug: 0
  debug: false
  debug_away: false
  mqtt_enabled: false
  mqtt_discovery: false
schema:
  lennox_email: "str?"        # Option A: Lennox account email (auto-provision)
  lennox_password: "password?" # Option A: Lennox account password
  home_id: "str?"             # Option B only: login homeId = DDS partition; auto with creds
  domain: int
  topic: str
  security_dir: "str?"
  dcps_debug: int
  debug: bool                # log every raw sample to the add-on log (for bug reports)
  debug_away: bool           # additionally subscribe read-only to the away topic
  mqtt_enabled: bool
  mqtt_discovery: bool        # true = also expose an HA MQTT climate entity
  # Optional explicit broker; if blank + mqtt_enabled, the Supervisor mqtt
  # service (Mosquitto) is used automatically.
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_user: "str?"
  mqtt_password: "password?"
