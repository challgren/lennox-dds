; =============================================================================
; OpenDDS configuration for the Lennox M30 RtpsRelay + DDS-Security bring-up.
;
; Mirrors the config the S40 app hands to native libLCS (BRINGUP.md has the
; decompiled evidence + FINDINGS.md the live-confirmed facts). relay.json
; ServerVersion/BranchName = "pkg-21".
;
; IMPORTANT: OpenDDS's config store does NOT strip trailing ";" comments -- keep
; every comment on its OWN line, never after a key=value.
;
; Load with:  -DCPSConfigFile opendds_rtps.ini
; =============================================================================

[common]
DCPSGlobalTransportConfig=rtps_relay_tc
DCPSDefaultDiscovery=rtps_relay_disc
; DDS-Security ON (governance requires authenticated participants; user data is
; rtps_protection_kind=ENCRYPT). Needs OpenDDS built with --security.
DCPSSecurity=1
DCPSDebugLevel=1

; -----------------------------------------------------------------------------
; Domain 0 (confirmed: Phase 3 + live governance.xml + permissions.xml).
; -----------------------------------------------------------------------------
[domain/lennox]
DomainId=0
DiscoveryConfig=rtps_relay_disc
DefaultTransportConfig=rtps_relay_tc

; -----------------------------------------------------------------------------
; Transport config -> instance. DCPSGlobalTransportConfig points at a [config/*],
; which lists [transport/*] instances (not a bare transport section).
; -----------------------------------------------------------------------------
[config/rtps_relay_tc]
transports=rtps_relay_udp

; -----------------------------------------------------------------------------
; RTPS/UDP transport through the data relay (relay.json DataRtpsRelayAddress).
; -----------------------------------------------------------------------------
[transport/rtps_relay_udp]
transport_type=rtps_udp
DataRtpsRelayAddress=4.151.164.12:4447
UseRtpsRelay=1
; App runs relay-only (USE_ICE=false). Force relay, no direct/ICE peer paths.
RtpsRelayOnly=1

; -----------------------------------------------------------------------------
; RTPS discovery through the OpenDDS RtpsRelay (SPDP + SEDP relay).
; App evidence (r8/g.java g.b()): SPDP_RESEND_PERIOD=15, USE_ICE=false.
; Known relay: SPDP 4.151.164.12:4445 / SEDP :4446 (from relay.json).
; -----------------------------------------------------------------------------
[rtps_discovery/rtps_relay_disc]
SpdpRtpsRelayAddress=4.151.164.12:4445
SedpRtpsRelayAddress=4.151.164.12:4446
; Announce well under the device's lccLivelinessTimeoutSeconds=12, or it drops us
; ~12s after association (before a sample is delivered). App uses 15 but also has
; app-level heartbeating; 5s keeps SPDP presence fresh.
ResendPeriod=5
RtpsRelayOnly=1
; XTypes ON: the skip_sequence_dheader patch makes TypeLookup interop work, and
; type negotiation is REQUIRED for the device to accept our reader + publish.

; =============================================================================
; DDS-Security documents are set PER-PARTICIPANT in code (the subscriber's
; PropertyQosPolicy), not here -- see lennox_zone_status_sub.cpp. File names
; (prod4 native / pulled bundle): identity_ca.pem, permissions_ca.pem,
; identity.pem, identity.key, governance.xml.p7s, permissions.xml.p7s.
;
; PARTITION (live permissions.xml): reader joins partition = login homeId
; (e.g. "5212374") -- passed as --partition, set on the Subscriber QoS in code.
; =============================================================================
