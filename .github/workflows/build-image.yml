name: build-image

# Builds the add-on's runtime image (the small subscriber + Python bridge) on top
# of the prebuilt OpenDDS base and pushes it to GHCR. Fast (minutes) -- the heavy
# OpenDDS base is prebuilt by build-base.yml and pulled as BASE.
on:
  push:
    branches: [main]
    paths:
      - 'container/**'
      - 'lennox_dds/config.yaml'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/challgren/lennox-dds
  BASE: ghcr.io/challgren/lennox-opendds-base:322dev-amd64-patched

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: v
        run: |
          ver=$(grep '^version:' lennox_dds/config.yaml | sed -E 's/version:[[:space:]]*"?([^"]+)"?.*/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "building $IMAGE:$ver"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          build-args: BASE=${{ env.BASE }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
