name: release

# Push a version tag (e.g. `git tag v0.1.6 && git push origin v0.1.6`) to cut a
# GitHub Release. The notes are the matching section from lennox_dds/CHANGELOG.md,
# so tags/releases stay in sync with the add-on's changelog.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section for this tag
        id: notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # print lines under the "## <ver>" heading (tolerating trailing text
          # like "## 0.1.17 (integration only)") up to the next "## " heading
          awk -v ver="$ver" '
            $0 ~ ("^## " ver "([ )]|$)") {grab=1; next}
            /^## / {if (grab) exit}
            grab {print}
          ' lennox_dds/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.notes.outputs.version }}"
          body_path: notes.md